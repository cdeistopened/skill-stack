# Curriculove Philosophy Quiz — Interview Config
# An adaptive conversation that types your homeschool style and recommends curricula

id: curriculove-philosophy-quiz
name: "Curriculove Homeschool Philosophy Finder"
version: "1.0.0"

# ─────────────────────────────────────────────────────────────
# GOAL
# ─────────────────────────────────────────────────────────────
goal: |
  Through friendly conversation, determine the user's homeschool philosophy,
  learning preferences, and practical constraints. Then recommend matching
  curricula from our database with personalized reasoning.

# ─────────────────────────────────────────────────────────────
# PERSONA
# ─────────────────────────────────────────────────────────────
persona:
  name: "Sage"
  tone: "warm, encouraging, knowledgeable but not preachy"
  avatar: "🦉"
  firstMessage: |
    Hi! I'm Sage, and I help homeschool families find curricula that actually
    fit how they learn. 
    
    Instead of a boring quiz, let's just chat. I'll ask a few questions and
    by the end, I'll have some personalized recommendations for you.
    
    Ready? Let's start with the big picture:
    **What matters most to you in your child's education?**

# ─────────────────────────────────────────────────────────────
# STARTER QUESTIONS (in rough order)
# ─────────────────────────────────────────────────────────────
starterQuestions:
  - "What matters most to you in your child's education?"
  - "How do you feel about structure? Do you like having a clear plan, or do you prefer flexibility?"
  - "How does your child learn best — reading, watching, doing with their hands, or listening?"
  - "What subjects are most important to you? Any you're struggling with?"
  - "What's your biggest frustration or challenge with homeschooling right now?"
  - "Do you have a budget range in mind for curriculum?"

# ─────────────────────────────────────────────────────────────
# PROBE QUESTIONS (follow-ups by topic)
# ─────────────────────────────────────────────────────────────
probeQuestions:
  philosophy_unclear:
    - "When you imagine the 'perfect' school day, what does it look like?"
    - "Are you drawn more to classical education, nature-based learning, or something else?"
    - "Do you want a curriculum that tells you exactly what to do, or one that gives you freedom?"
  
  learning_style_unclear:
    - "Does your child prefer to figure things out themselves or have things explained?"
    - "Do they get antsy sitting still, or can they focus for long stretches?"
    - "Do they love reading, or is it a struggle?"
  
  struggling_subject:
    - "What have you tried so far for [subject]?"
    - "What specifically isn't working?"
    - "Is it the content, the format, or engagement that's the issue?"
  
  budget:
    - "Are you looking for mostly free resources, or open to investing in quality curriculum?"
    - "Would you rather spend more upfront for an all-in-one, or piece things together?"

# ─────────────────────────────────────────────────────────────
# REQUIRED FIELDS (must extract before completing)
# ─────────────────────────────────────────────────────────────
requiredFields:
  - philosophy_type
  - structure_preference
  - learning_style
  - grade_level
  - subject_priorities

optionalFields:
  - budget_range
  - religious_preference
  - specific_challenges
  - previous_curricula_tried

# ─────────────────────────────────────────────────────────────
# COMPLETION
# ─────────────────────────────────────────────────────────────
maxTurns: 12
completionPrompt: |
  Great chatting with you! Based on our conversation, here's what I learned
  and my recommendations...

# ─────────────────────────────────────────────────────────────
# OUTPUT SCHEMA
# ─────────────────────────────────────────────────────────────
outputSchema:
  type: object
  required:
    - philosophy_type
    - structure_preference
    - learning_style
    - recommendations
  properties:
    # Philosophy typing
    philosophy_type:
      type: string
      enum:
        - classical
        - charlotte_mason
        - montessori
        - unschooling
        - eclectic
        - traditional
        - waldorf
        - school_at_home
      description: "Primary homeschool philosophy"
    
    philosophy_secondary:
      type: string
      description: "Secondary influence if eclectic"
    
    structure_preference:
      type: string
      enum:
        - highly_structured    # "Tell me exactly what to do"
        - moderate             # "Give me a plan but let me adapt"
        - flexible             # "Suggestions, not scripts"
        - child_led            # "Follow the child's interests"
    
    learning_style:
      type: string
      enum:
        - visual               # Charts, videos, diagrams
        - auditory             # Audiobooks, discussion, lectures
        - kinesthetic          # Hands-on, movement, building
        - reading_writing      # Books, workbooks, journaling
        - mixed
    
    # Practical info
    grade_level:
      type: string
      description: "e.g., 'K-2', '3rd grade', 'middle school'"
    
    subject_priorities:
      type: array
      items:
        type: string
      description: "Subjects they care most about"
    
    struggling_subjects:
      type: array
      items:
        type: string
      description: "Subjects they're having trouble with"
    
    budget_range:
      type: string
      enum:
        - free_only            # $0
        - minimal              # < $200/year
        - moderate             # $200-500/year
        - flexible             # $500+/year
        - not_specified
    
    religious_preference:
      type: string
      enum:
        - catholic
        - christian_non_denom
        - secular
        - open_to_any
        - not_specified
    
    # Challenges and context
    specific_challenges:
      type: array
      items:
        type: string
      description: "Pain points mentioned"
    
    previous_curricula:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          liked:
            type: boolean
          notes:
            type: string
    
    # Recommendations (filled by engine after DB query)
    recommendations:
      type: array
      items:
        type: object
        properties:
          curriculum_id:
            type: string
          name:
            type: string
          match_score:
            type: number
            minimum: 0
            maximum: 100
          match_reasons:
            type: array
            items:
              type: string
          caveats:
            type: array
            items:
              type: string
    
    # Meta
    conversation_summary:
      type: string
      description: "2-3 sentence summary of what we learned"
    
    confidence_score:
      type: number
      minimum: 0
      maximum: 100
      description: "How confident we are in the typing"

# ─────────────────────────────────────────────────────────────
# BEHAVIOR
# ─────────────────────────────────────────────────────────────
adaptiveness: moderate  # Follow interesting threads but stay goal-oriented

behaviorRules:
  - "Never be judgmental about any homeschool approach"
  - "If they mention a specific curriculum, ask what they liked/disliked"
  - "If they seem overwhelmed, reassure them there's no wrong answer"
  - "If they're experienced, skip basic questions and go deeper"
  - "Always validate their challenges before offering solutions"
  - "End with encouragement, not just a list of products"
