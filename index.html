<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect for faster API calls -->
    <link rel="preconnect" href="https://convex.cloud" crossorigin />
    <link rel="dns-prefetch" href="https://convex.cloud" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Open-source SKILL.md files for Claude Code. Download, install, build. Skills for writing, voice matching, content creation, and AI workflows."
    />
    <meta name="author" content="Charlie Deist" />
    <meta
      name="keywords"
      content="Claude Code skills, SKILL.md, AI skills, content creation, prompt engineering, AI writing, voice matching, knowledge refinery"
    />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#faf8f5" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Skill Stack — Install a skill. Ship something real."
    />
    <meta
      property="og:description"
      content="Open-source SKILL.md files for Claude Code. Download, install, build."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skillstack.md/" />
    <meta property="og:site_name" content="Skill Stack" />
    <meta
      property="og:image"
      content="https://skillstack.md/images/thumbnails/skill-stack.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:domain" content="skillstack.md" />
    <meta property="twitter:url" content="https://skillstack.md/" />
    <meta
      name="twitter:title"
      content="Skill Stack — Install a skill. Ship something real."
    />
    <meta
      name="twitter:description"
      content="Open-source SKILL.md files for Claude Code. Download, install, build."
    />
    <meta
      name="twitter:image"
      content="https://skillstack.md/images/thumbnails/skill-stack.png"
    />

    <!-- RSS Feeds -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="RSS Feed"
      href="/rss.xml"
    />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="RSS Feed (Full Content)"
      href="/rss-full.xml"
    />

    <!-- LLM and AI Discovery -->
    <link rel="author" href="/llms.txt" />

    <!-- JSON-LD Structured Data for Homepage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Skill Stack",
        "url": "https://skillstack.md",
        "description": "Open-source SKILL.md files for Claude Code. Download, install, build.",
        "author": {
          "@type": "Person",
          "name": "Charlie Deist",
          "url": "https://x.com/chdeist"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://skillstack.md/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <title>Skill Stack — Install a skill. Ship something real.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
